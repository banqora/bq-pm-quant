name: ci

on:
  push:
    # This repo's default branch is master; [main] alone meant the push trigger never fired.
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: it is what references/coding-standards.md documents as
        # requires-python, and 3.9 reached end of life in October 2025.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill structure
        run: scripts/check-skill --static
      - name: Run the test suite
        run: tests/run

  quality:
    # The gates the skill itself mandates in references/coding-standards.md and that pm-audit
    # tells its users to run. Versions are pinned, per that file's own instruction.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned tools
        run: pip install ruff==0.14.4 mypy==2.3.1
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for f in tests/run tests/*.sh scripts/check-skill; do
            bash -n "$f"
          done
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: skills
