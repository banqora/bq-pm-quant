name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill structure
        run: scripts/check-skill --static
      - name: Run the test suite
        run: tests/run

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for f in tests/run tests/*.sh scripts/check-skill; do
            bash -n "$f"
          done
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: skills
